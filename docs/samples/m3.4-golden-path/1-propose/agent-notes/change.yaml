changeId: chg-notification-rejection-reason
projectId: prj-course-desk
expectedRevision: rev-2-a21d7aa4915e
rationale: >
  Rejected students only get the reason inside the message text. Enrollment already stores the
  machine-readable reason (enrollment.types.ts Enrollment.reason; enrollment.service.ts enroll()),
  but Notification (notification.types.ts) has no such field, so the web page cannot show it.
  Add a nullable reason attribute to the Notification data, set only on enrollment-rejected
  notifications, and describe the web page showing it. Left unchanged on purpose: Enrollment data,
  seat-limit rule, module dependencies (mod-notifications stays dependency-free, so the reason is
  typed string there like Enrollment.reason, not a reference), no events/contracts, confirmed
  enrollments and their notifications, capabilities, and the message texts.
operations:
  - type: addDataAttribute
    dataId: dat-notification
    attribute: { id: att-ntf-reason, name: reason, type: string, nullable: true }
  - type: setDescription
    objectId: dat-notification
    description: >
      notification.types.ts, in-memory outbox; ids ntf-N. kind is enrollment-confirmed|enrollment-rejected.
      reason is COURSE_FULL|ALREADY_ENROLLED, set only on enrollment-rejected notifications and absent on
      confirmed ones; it duplicates the rejected Enrollment's reason as its own field in addition to the
      message text. enrollmentId points at an Enrollment in another module, so it is typed id rather than reference.
  - type: setRuleStatement
    ruleId: rul-announce-every-decision
    statement: >
      Each enrollment decision, confirmed or rejected, is recorded and results in exactly one notification to the
      student. A rejection notification also carries the rejection reason (COURSE_FULL or ALREADY_ENROLLED) as its own field.
  - type: setDescription
    objectId: cap-use-ui
    description: >
      App.tsx: submit the form, show outcome, then reload that student's notifications and the course seat counts.
      A rejected notification is shown with its rejection reason next to it.
implementation:
  behavior: >
    When an enrollment is rejected, the notification created for the student carries the rejection reason
    (COURSE_FULL or ALREADY_ENROLLED) in a new optional `reason` field, returned by GET /notifications, and the
    web page shows that reason next to the rejected notification. Confirmed notifications have no reason.
  acceptanceCriteria:
    - A COURSE_FULL rejection produces a notification with reason COURSE_FULL, and the message text is unchanged
    - An ALREADY_ENROLLED rejection produces a notification with reason ALREADY_ENROLLED
    - A confirmed enrollment's notification has no reason field and is otherwise unchanged
    - GET /api/notifications returns the reason for rejected notifications
    - The web page shows the reason next to a rejected notification and nothing extra for confirmed ones
    - The notifications module does not import from the enrollment module (no new module dependency)
  suggestedTests:
    - "EnrollmentService: rejects an enrollment into a full course and notifies the student"
    - "NotificationsService: keeps each recipient's notifications separate, in order"
    - "App: shows the outcome and the student's notification after enrolling, then a rejection when full"
  scope:
    - server/src/notifications/**
    - server/src/enrollment/enrollment.service.ts
    - server/src/enrollment/enrollment.service.spec.ts
    - server/test/app.e2e-spec.ts
    - web/src/api/client.ts
    - web/src/components/NotificationList.tsx
    - web/src/App.test.tsx
