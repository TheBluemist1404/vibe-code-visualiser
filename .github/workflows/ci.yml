name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      # Formatting and lint (Biome). Run `npm run format` locally to fix formatting.
      - run: npm run check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest supported (package.json engines) and latest 22.x.
        node: ["22.18.0", "22.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The M2.2 reference app (examples/reference-app), installed and run as a standalone repository.
  reference-app:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The fixture's own minimum (its package.json engines; jsdom needs 22.22.2) and latest 22.x.
        node: ["22.22.2", "22.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/reference-app/template/package-lock.json
      - run: npm ci
      - run: examples/reference-app/check.sh "$RUNNER_TEMP/course-desk"
      # M2.5: the controlled waitlist change applies to a fresh checkout and the app's own checks pass on it.
      - run: examples/reference-app/maintenance/setup.sh "$RUNNER_TEMP/course-desk-waitlist" --app-tests
      # M3.4: the recorded model-first golden path, replayed from a fresh checkout and a fresh reviewer key
      # (proposal, separate approval, implementation, host gate, branch views, negative paths), with the app's checks.
      - run: examples/reference-app/golden-path/replay.sh "$RUNNER_TEMP/golden-path" --app-tests
      # M4.5: the code-first pre-merge golden path from a fresh checkout (criteria, mapped tests, the gate
      # on broken / fixed / harmless / weak-evidence / intent-change candidates, negative paths, merge views).
      - run: |
          examples/reference-app/premerge/setup.sh "$RUNNER_TEMP/premerge"
          examples/reference-app/premerge/scenarios.sh "$RUNNER_TEMP/premerge" "$RUNNER_TEMP/premerge-out"
          examples/reference-app/premerge/selfcheck.sh "$RUNNER_TEMP/premerge" "$RUNNER_TEMP/premerge-selfcheck"

  # M5: the local architecture explorer, built and driven in a real browser against real checkouts.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          VCV_UI_SHOTS: ${{ runner.temp }}/ui-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}/ui-shots
          if-no-files-found: ignore

  # M5.7: the acceptance walkthrough on the real Course Desk repository (Issue #46): the explorer in a
  # real browser, the agent in its own clone, a TEST-ONLY fixture reviewer and the gate at each step.
  # The scripts run as root only to start each context as its own OS user: the workspace user (explorer,
  # agent, gate) cannot open the fixture key, which only the reviewer user can.
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/pw-browsers # readable by the workspace user, unlike ~/.cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The two users must reach this checkout (read-only) and the work directory.
      - run: chmod o+x "$HOME" "$HOME/work"
      - run: sudo env PATH="$PATH" PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" examples/reference-app/acceptance/setup.sh /tmp/acceptance
      - run: sudo env PATH="$PATH" PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" examples/reference-app/acceptance/run.sh /tmp/acceptance /tmp/acceptance-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5.7-acceptance
          path: /tmp/acceptance-out
          if-no-files-found: ignore
